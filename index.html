<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepResearch AI</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js for professional Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        #logs-container::-webkit-scrollbar { width: 6px; }
        #logs-container::-webkit-scrollbar-track { background: #0f172a; }
        #logs-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .prose h1 { font-size: 1.75rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 1rem; color: #1e293b; }
        .prose h2 { font-size: 1.35rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.75rem; color: #1e293b; }
        .prose h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #1e293b; }
        .prose p { margin-bottom: 1rem; line-height: 1.7; color: #334155; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #334155; }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; color: #334155; }
        .prose li { margin-bottom: 0.35rem; }
        .prose strong { color: #0f172a; font-weight: 600; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 pb-28">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white shadow">
                    <i data-lucide="search" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">DeepResearch AI</h1>
                    <p class="text-xs text-slate-500 font-medium">Powered by Gemini AI & Vercel Backend</p>
                </div>
            </div>
            <div class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold bg-green-50 text-green-700 border border-green-200">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
                <span>Secure Proxy Active</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 sm:px-6 lg:px-8 space-y-8">
        
        <!-- Input Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 space-y-6">
                <div>
                    <label for="query" class="block text-sm font-semibold text-slate-700 mb-2">
                        What would you like to research?
                    </label>
                    <textarea
                        id="query"
                        rows="3"
                        class="w-full rounded-xl border-slate-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-slate-50 p-4 text-slate-900 resize-none transition-colors border outline-none"
                        placeholder="Ask any question (e.g., Does the pink tax really exist? What are quantum computers?)"
                    ></textarea>
                    <p class="text-xs text-slate-400 mt-2 text-right">Press Ctrl+Enter or Cmd+Enter to submit</p>
                </div>

                <div class="flex flex-col sm:flex-row gap-6 items-start sm:items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <div class="flex flex-wrap items-center gap-4">
                        <!-- Mode Selector -->
                        <div class="space-y-1">
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">Mode</span>
                            <div class="flex bg-slate-200/50 p-1 rounded-lg">
                                <button id="btn-summary" class="flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-blue-700 shadow-sm">
                                    <i data-lucide="file-text" class="w-4 h-4"></i> Summary
                                </button>
                                <button id="btn-essay" class="flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all text-slate-600 hover:text-slate-900">
                                    <i data-lucide="book-open" class="w-4 h-4"></i> Essay
                                </button>
                            </div>
                        </div>

                        <!-- Length Selector -->
                        <div id="length-container" class="space-y-1 hidden">
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">Length</span>
                            <select id="essay-length" class="block w-full rounded-lg border-slate-200 bg-white px-3 py-2 text-sm font-medium shadow-sm focus:border-blue-500 focus:ring-blue-500 outline-none border text-slate-700">
                                <option value="short">Short (~300 words)</option>
                                <option value="medium" selected>Medium (~600 words)</option>
                                <option value="long">Long (~1000+ words)</option>
                            </select>
                        </div>
                    </div>

                    <button id="btn-submit" class="w-full sm:w-auto flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-8 py-3 rounded-xl font-semibold transition-all disabled:opacity-70 disabled:cursor-not-allowed shadow-sm hover:shadow">
                        <i data-lucide="search" class="w-[18px] h-[18px]" id="submit-icon"></i>
                        <span id="submit-text">Begin Research</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section id="result-section" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="border-b border-slate-100 bg-slate-50/50 px-6 py-4 flex items-center justify-between">
                <h2 id="result-title" class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-5 h-5 text-blue-500" id="result-icon"></i>
                    <span>Research Summary</span>
                </h2>
                <span class="text-xs font-medium px-2.5 py-1 bg-green-100 text-green-700 rounded-full flex items-center gap-1">
                    <i data-lucide="check" class="w-3 h-3"></i> AI Analysis Complete
                </span>
            </div>
            
            <div class="p-6 sm:p-8 md:p-10">
                <div id="result-content" class="prose max-w-none"></div>
            </div>

            <div class="bg-slate-50 border-t border-slate-100 p-4 flex justify-end">
                <button id="btn-copy" class="flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-semibold transition-all bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:text-blue-600 shadow-sm">
                    <i data-lucide="copy" class="w-4 h-4" id="copy-icon"></i>
                    <span id="copy-text">Copy to Clipboard</span>
                </button>
            </div>
        </section>

        <!-- Sources / References Section -->
        <section id="sources-section" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="border-b border-slate-100 bg-slate-50/50 px-6 py-4">
                <h3 class="text-md font-semibold text-slate-800 flex items-center gap-2">
                    <i data-lucide="link-2" class="w-[18px] h-[18px] text-blue-500"></i>
                    Sources & Data References
                </h3>
            </div>
            <div class="p-6">
                <div id="sources-content" class="prose max-w-none text-sm text-slate-600"></div>
            </div>
        </section>

    </main>

    <!-- Error Logger Terminal -->
    <section class="fixed bottom-0 left-0 right-0 z-30">
        <div class="bg-slate-900 border-t-2 border-slate-700 text-slate-300 shadow-2xl max-h-64 flex flex-col">
            <div class="flex items-center justify-between px-4 py-2 bg-slate-950 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <i data-lucide="terminal" class="w-3.5 h-3.5 text-slate-400"></i>
                    <span class="text-xs font-mono font-semibold tracking-wider text-slate-400">SYSTEM LOGGER</span>
                </div>
                <div class="flex items-center gap-3">
                    <span id="log-count" class="text-[10px] font-mono text-slate-600">0 events logged</span>
                    <button id="btn-clear-logs" title="Clear Logs" class="text-slate-500 hover:text-red-400 transition-colors">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>
            
            <div id="logs-container" class="flex-1 overflow-y-auto p-4 font-mono text-xs space-y-1.5 min-h-[90px] max-h-[170px]">
                <div id="empty-log" class="text-slate-600 italic">No system events or errors logged yet. Waiting for activity...</div>
            </div>
        </div>
    </section>

    <!-- Application Script -->
    <script>
        lucide.createIcons();

        const state = {
            mode: localStorage.getItem('dr_mode') || 'summary',
            isLoading: false,
            resultText: localStorage.getItem('dr_result') || '',
            sourcesText: localStorage.getItem('dr_sources') || '',
            logsCount: 0
        };

        const dom = {
            query: document.getElementById('query'),
            btnSummary: document.getElementById('btn-summary'),
            btnEssay: document.getElementById('btn-essay'),
            lengthContainer: document.getElementById('length-container'),
            essayLength: document.getElementById('essay-length'),
            btnSubmit: document.getElementById('btn-submit'),
            submitIcon: document.getElementById('submit-icon'),
            submitText: document.getElementById('submit-text'),
            resultSection: document.getElementById('result-section'),
            resultTitle: document.getElementById('result-title'),
            resultContent: document.getElementById('result-content'),
            btnCopy: document.getElementById('btn-copy'),
            copyIcon: document.getElementById('copy-icon'),
            copyText: document.getElementById('copy-text'),
            sourcesSection: document.getElementById('sources-section'),
            sourcesContent: document.getElementById('sources-content'),
            logsContainer: document.getElementById('logs-container'),
            emptyLog: document.getElementById('empty-log'),
            logCount: document.getElementById('log-count'),
            btnClearLogs: document.getElementById('btn-clear-logs')
        };

        if (state.mode === 'essay') setModeUI('essay');
        if (state.resultText) {
            dom.resultContent.innerHTML = marked.parse(state.resultText);
            dom.resultSection.classList.remove('hidden');
        }
        if (state.sourcesText) {
            dom.sourcesContent.innerHTML = marked.parse(state.sourcesText);
            dom.sourcesSection.classList.remove('hidden');
        }

        function addLog(msg, type = 'info') {
            if (dom.emptyLog) dom.emptyLog.style.display = 'none';
            state.logsCount++;
            dom.logCount.textContent = `${state.logsCount} events logged`;

            const time = new Date().toLocaleTimeString();
            let colorCls = 'text-slate-300';
            let iconHtml = '<span class="text-blue-400 shrink-0 mt-0.5 font-bold">></span>';

            if (type === 'error') {
                colorCls = 'text-red-300';
                iconHtml = '<i data-lucide="alert-circle" class="w-3.5 h-3.5 text-red-400 shrink-0 mt-0.5"></i>';
            } else if (type === 'warning') {
                colorCls = 'text-yellow-300';
                iconHtml = '<i data-lucide="alert-circle" class="w-3.5 h-3.5 text-yellow-400 shrink-0 mt-0.5"></i>';
            } else if (type === 'success') {
                colorCls = 'text-green-300';
                iconHtml = '<i data-lucide="check" class="w-3.5 h-3.5 text-green-400 shrink-0 mt-0.5"></i>';
            }

            const logEntry = document.createElement('div');
            logEntry.className = 'flex items-start gap-3 hover:bg-slate-800/50 py-0.5 px-1 rounded';
            logEntry.innerHTML = `
                <span class="text-slate-500 shrink-0">[${time}]</span>
                ${iconHtml}
                <span class="break-words ${colorCls}">${msg}</span>
            `;
            
            dom.logsContainer.appendChild(logEntry);
            lucide.createIcons({ root: logEntry });
            dom.logsContainer.scrollTop = dom.logsContainer.scrollHeight;
        }

        dom.btnClearLogs.addEventListener('click', () => {
            dom.logsContainer.innerHTML = '<div id="empty-log" class="text-slate-600 italic">No system events or errors logged yet. Waiting for activity...</div>';
            dom.emptyLog = document.getElementById('empty-log');
            state.logsCount = 0;
            dom.logCount.textContent = `0 events logged`;
        });

        const originalConsoleError = console.error;
        console.error = (...args) => {
            addLog(`Console Error: ${args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ')}`, 'error');
            originalConsoleError(...args);
        };

        function setModeUI(mode) {
            state.mode = mode;
            localStorage.setItem('dr_mode', mode);
            if (mode === 'summary') {
                dom.btnSummary.className = "flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-blue-700 shadow-sm";
                dom.btnEssay.className = "flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all text-slate-600 hover:text-slate-900";
                dom.lengthContainer.classList.add('hidden');
            } else {
                dom.btnEssay.className = "flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all bg-white text-blue-700 shadow-sm";
                dom.btnSummary.className = "flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-all text-slate-600 hover:text-slate-900";
                dom.lengthContainer.classList.remove('hidden');
            }
        }

        dom.btnSummary.addEventListener('click', () => setModeUI('summary'));
        dom.btnEssay.addEventListener('click', () => setModeUI('essay'));

        async function handleResearch() {
            const query = dom.query.value.trim();
            if (!query) {
                addLog("Please enter a question or topic to research.", "warning");
                return;
            }

            state.isLoading = true;
            dom.btnSubmit.disabled = true;
            dom.submitIcon.setAttribute('data-lucide', 'loader-2');
            dom.submitIcon.classList.add('animate-spin');
            dom.submitText.textContent = 'Researching...';
            lucide.createIcons();
            
            dom.resultSection.classList.add('hidden');
            dom.sourcesSection.classList.add('hidden');
            
            addLog(`Starting research for: "${query}" (Mode: ${state.mode})`, "info");

            try {
                const response = await fetch('/api/research', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        mode: state.mode,
                        length: dom.essayLength.value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `Server error: ${response.status}`);
                }

                const fullText = data.text;
                
                let mainContent = fullText;
                let sourcesText = "";
                const splitMarker = "### Sources & References";
                if (fullText.includes(splitMarker)) {
                    const parts = fullText.split(splitMarker);
                    mainContent = parts[0].trim();
                    sourcesText = parts[1].trim();
                }

                state.resultText = mainContent;
                state.sourcesText = sourcesText;
                localStorage.setItem('dr_result', mainContent);
                localStorage.setItem('dr_sources', sourcesText);

                dom.resultContent.innerHTML = marked.parse(mainContent);
                dom.resultTitle.innerHTML = `
                    <i data-lucide="${state.mode === 'summary' ? 'file-text' : 'book-open'}" class="w-5 h-5 text-blue-500"></i>
                    <span>Research ${state.mode === 'summary' ? 'Summary' : 'Essay'}</span>
                `;
                dom.resultSection.classList.remove('hidden');

                if (sourcesText) {
                    dom.sourcesContent.innerHTML = marked.parse(sourcesText);
                    dom.sourcesSection.classList.remove('hidden');
                }

                addLog("Research analysis completed successfully via secure proxy.", "success");
                lucide.createIcons();

            } catch (error) {
                addLog(`Research failed: ${error.message}`, "error");
                dom.resultContent.innerHTML = `<p class="text-red-600 font-semibold">An error occurred while researching.</p><p class="text-slate-600 mt-2">${error.message}</p>`;
                dom.resultSection.classList.remove('hidden');
            } finally {
                state.isLoading = false;
                dom.btnSubmit.disabled = false;
                dom.submitIcon.setAttribute('data-lucide', 'search');
                dom.submitIcon.classList.remove('animate-spin');
                dom.submitText.textContent = 'Begin Research';
                lucide.createIcons();
            }
        }

        function handleCopy() {
            if (!state.resultText) return;
            const textArea = document.createElement("textarea");
            textArea.value = state.resultText + (state.sourcesText ? `\n\nSources & References:\n${state.sourcesText}` : '');
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                dom.btnCopy.className = "flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-semibold transition-all bg-green-100 text-green-700 border border-green-200";
                dom.copyIcon.setAttribute('data-lucide', 'check');
                dom.copyText.textContent = "Copied to Clipboard!";
                lucide.createIcons();
                addLog("Content successfully copied to clipboard.", "info");

                setTimeout(() => {
                    dom.btnCopy.className = "flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-semibold transition-all bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 hover:text-blue-600 shadow-sm";
                    dom.copyIcon.setAttribute('data-lucide', 'copy');
                    dom.copyText.textContent = "Copy to Clipboard";
                    lucide.createIcons();
                }, 3000);
            } catch (err) {
                addLog("Failed to copy text using execCommand.", "error");
            } finally {
                document.body.removeChild(textArea);
            }
        }

        dom.btnSubmit.addEventListener('click', handleResearch);
        dom.btnCopy.addEventListener('click', handleCopy);
        dom.query.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleResearch();
        });
    </script>
</body>
</html>
